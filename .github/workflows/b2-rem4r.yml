# TEST FIXTURE (B2 acceptance smoke) -- REM4-R executor workflow.
# Drives the B2 acceptance fixture re-run on a disposable Ubuntu runner:
# fixture up -> preflight gates -> unit proof -> run -> assertions -> teardown.
# Dispatched manually (workflow_dispatch) by the supervisor; no schedule.
# v2: re-parse bump (workflow_dispatch trigger index).
# v3 (REM5 env-accommodation): resolver fleet pinned to the committed 15-anycast
#     seed (sources disabled at run time, transient working-copy edit only);
#     run.log + resolver forge outputs added to evidence. Reason: run
#     20260904T223501Z A3 anomaly = stale public resolver tail x runner egress
#     -> breaker latency cascade -> canary 2-bad-windows pause. Machinery
#     conformant; accommodation is environment-only, disclosed in PHASE-REPORT.
# v4 (REM6): build the pinned LOCAL tool image recon-pipeline/ffuf:v2.1.0 before
#     the run (fresh runner has no local images; runs #4/#5 ffuf invocations died
#     exit 125 'pull access denied' -> breaker pause -> anomaly). Assertions now
#     carry stale-evidence guards: A4/A5/A7 evidence files must be NEWER than
#     their module's started_at, else mandatory FAIL (skipped module must never
#     pass on committed stale files).

name: b2-rem4r

on:
  workflow_dispatch:

concurrency:
  group: b2-rem4r
  cancel-in-progress: false

jobs:
  rem4r:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: "Checkout (branch: private)"
        uses: actions/checkout@v4
        with:
          ref: private

      - name: Toolchain sanity (docker + python3 + sudo)
        run: |
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          python3 --version
          sudo -n true && echo "sudo-ok"

      - name: Activate fixture (compose profile + /etc/hosts)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.vhost-fixture.yml --profile vhost-fixture up -d --build
          sudo -n python3 docker/vhost-fixture/hosts.py install
          grep -n "recon-pipeline vhost-fixture" /etc/hosts
          getent hosts app.fixture-target.test || resolveip_confirmed=1
          python3 - <<'PY'
          import socket
          for name in ("fixture-target.test", "app.fixture-target.test", "www.fixture-target.test"):
              print(name, "->", socket.gethostbyname(name))
          PY

      - name: "Build pinned local tool images (REM6: ffuf v2.1.0)"
        run: |
          set -e
          docker build -t recon-pipeline/ffuf:v2.1.0 -f docker/ffuf/Dockerfile docker/ffuf
          docker image inspect recon-pipeline/ffuf:v2.1.0 --format 'ffuf-image-ok {{.Id}}'

      - name: Preflight gates (forge anchor, selection, scope, verify_b1)
        run: PYTHONPATH=. python3 ci/rem4r_preflight.py

      - name: "Install suite deps (REM22/REM23 parity: fastapi + uvicorn + httpx + reportlab)"
        run: python3 -m pip install --quiet "fastapi==0.115.6" "uvicorn==0.34.0" "httpx==0.28.1" "reportlab==4.2.5"
      - name: R1 unit proof (bidirectional regression)
        run: PYTHONPATH=. python3 -m unittest discover -s tests -t . -v

      - name: Reconcile stale live state (frozen stop path; expect EXIT 4 or usage)
        run: |
          set +e
          ./recon.sh stop fixture-target.test
          echo "stop exit=$?"

      - name: "REM5 env-accommodation (pin resolver fleet to committed seed)"
        run: |
          set -e
          cp resolvers.yaml ci/rem4r_resolvers_runtime_before.yaml
          python3 - <<'PY'
          import pathlib
          import yaml
          p = pathlib.Path("resolvers.yaml")
          d = yaml.safe_load(p.read_text(encoding="utf-8"))
          n = len(d.get("sources") or [])
          d["sources"] = []
          p.write_text(yaml.safe_dump(d, sort_keys=False), encoding="utf-8")
          print(f"ENV-ACCOMMODATION REM5: disabled {n} public source URLs at run time; fleet = resolvers/seed.txt (15 pinned anycast). Transient working-copy edit only - never committed.")
          PY

      - name: Run isolated B2 fixture run (fixture-target.test)
        id: run
        run: |
          set +e
          ./recon.sh run fixture-target.test 2>&1 | tee ci/rem4r_run_console.log
          echo "run exit=${PIPESTATUS[0]}" | tee ci/rem4r_run_exit.txt

      - name: Assertions (REM4-R acceptance table)
        id: assertions
        run: |
          PYTHONPATH=. python3 ci/rem4r_assertions.py 2>&1 | tee ci/rem4r_assertions_console.log
          exit "${PIPESTATUS[0]}"

      - name: Teardown (always)
        if: always()
        run: |
          sudo -n python3 docker/vhost-fixture/hosts.py remove || true
          docker compose -f docker-compose.yml -f docker-compose.vhost-fixture.yml --profile vhost-fixture down -v || true

      - name: Upload evidence artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem4r-evidence
          path: |
            ci/rem4r_verdict.txt
            ci/rem4r_run_exit.txt
            ci/rem4r_run_console.log
            ci/rem4r_assertions_console.log
            ci/rem4r_resolvers_runtime_before.yaml
            wordlists/forge/counts.log
            wordlists/forge/custom-subdomains.txt
            resolvers/forge/custom-resolvers.txt
            resolvers/forge/quarantine.txt
            recon/fixture-target.test/logs/run.log
            recon/fixture-target.test/state.json
            recon/fixture-target.test/runs.json
            recon/fixture-target.test/diff.json
            recon/fixture-target.test/00_assets/summary.md
            recon/fixture-target.test/10_subdomains/ffuf/summary.md
            recon/fixture-target.test/10_subdomains/ffuf/data.json
            recon/fixture-target.test/15_vhosts/ffuf/**
            recon/fixture-target.test/20_dns/dnsx/summary.md
            recon/fixture-target.test/20_dns/dnsx/data.json
            recon/fixture-target.test/30_ports/**
          if-no-files-found: warn

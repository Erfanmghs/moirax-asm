# B3 FIRST SUB-STEP (spec v1.9 Option-1 mandate) -- FFUF-3 production
# implementation + DNSR-2 aggregate-cap/suspect-exclusion refinement.
#
# Vehicle: fixture-target.test (deterministic, committed scope) with a
# TRANSIENT selection override [test_smoke_200] (wordlists.yaml working-copy
# edit, never committed; before-copy kept as evidence) + transient REM5
# resolver fleet pin. Production defaults remain committed (G-B6).
#
# Authorized code delta (B3 scope, spec v1.9 section 8.2 next-phase rule):
#   FFUF-3 module (pipeline/modules/ffuf3.py + wiring) and DNSR-2 refinement
#   (pipeline/modules/dns_resolve.py). verify_b1.py diff stays empty.
#
# Steps: checkout -> toolchain -> fixture up -> ffuf image (REM6) -> preflight
# -> unit proof -> reconcile stale state -> REM5 fleet pin (transient) ->
# vehicle selection override (transient) -> run fixture-target.test ->
# assertions D1..D9 -> teardown -> evidence upload.

name: b3-ffuf3

on:
  workflow_dispatch:

concurrency:
  group: b3-ffuf3
  cancel-in-progress: false

jobs:
  b3:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: "Checkout (branch: private)"
        uses: actions/checkout@v4
        with:
          ref: private

      - name: Toolchain sanity (docker + python3 + sudo)
        run: |
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          python3 --version
          sudo -n true && echo "sudo-ok"

      - name: "Clone SecLists (DNSR-1 default key materialization source; host-side ~/seclists)"
        run: |
          git clone --depth 1 https://github.com/danielmiessler/SecLists "$HOME/seclists"
          test -f "$HOME/seclists/Discovery/DNS/subdomains-top1million-5000.txt" && echo "seclists-ok"

      - name: Activate fixture (compose profile + /etc/hosts)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.vhost-fixture.yml --profile vhost-fixture up -d --build
          sudo -n python3 docker/vhost-fixture/hosts.py install
          grep -n "recon-pipeline vhost-fixture" /etc/hosts
          python3 - <<'PY'
          import socket
          for name in ("fixture-target.test", "app.fixture-target.test", "www.fixture-target.test"):
              print(name, "->", socket.gethostbyname(name))
          PY

      - name: "Build pinned local tool images (REM6: ffuf v2.1.0)"
        run: |
          set -e
          docker build -t recon-pipeline/ffuf:v2.1.0 -f docker/ffuf/Dockerfile docker/ffuf
          docker image inspect recon-pipeline/ffuf:v2.1.0 --format 'ffuf-image-ok {{.Id}}'

      - name: Preflight gates (anchor, FFUF-3 wiring, DNSR-2, verify_b1)
        run: PYTHONPATH=. python3 ci/b3_preflight.py

      - name: Unit proof (FFUF-3 + DNSR-2 regression suite)
        run: PYTHONPATH=. python3 -m unittest discover -s tests -t . -v

      - name: Reconcile stale live state (frozen stop path; expect EXIT 4 or usage)
        run: |
          set +e
          ./recon.sh stop fixture-target.test
          echo "stop exit=$?"

      - name: "REM5 env-accommodation (pin resolver fleet to committed seed)"
        run: |
          set -e
          cp resolvers.yaml ci/b3_resolvers_runtime_before.yaml
          python3 - <<'PY'
          import pathlib
          import yaml
          p = pathlib.Path("resolvers.yaml")
          d = yaml.safe_load(p.read_text(encoding="utf-8"))
          n = len(d.get("sources") or [])
          d["sources"] = []
          p.write_text(yaml.safe_dump(d, sort_keys=False), encoding="utf-8")
          print(f"ENV-ACCOMMODATION REM5: disabled {n} public source URLs at run time; fleet = resolvers/seed.txt (15 pinned anycast). Transient working-copy edit only - never committed.")
          PY

      - name: "Vehicle bounding override (REM10, transient: selection [test_smoke_200])"
        run: |
          set -e
          cp wordlists.yaml ci/b3_wordlists_runtime_before.yaml
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("wordlists.yaml")
          lines = p.read_text(encoding="utf-8").splitlines()
          out: list[str] = []
          inserted: list[str] = []
          for line in lines:
              out.append(line)
              m = re.match(r"^  (DNSR-1|FFUF-0|FFUF-2):\s*(#.*)?$", line)
              if m:
                  indent = " " * (len(line) - len(line.lstrip()) + 2)
                  out.append(f"{indent}selection:")
                  out.append(f"{indent}  - test_smoke_200")
                  inserted.append(m.group(1))
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          print(f"VEHICLE OVERRIDE (REM10, project minimal-YAML style): inserted transient selection [test_smoke_200] under tasks {inserted}. Text insertion only - the frozen yaml_util loader must still parse this file (run #14 lesson: pyyaml safe_dump reformatting breaks the frozen loader, same class as T4-A df52121). Committed defaults untouched; before-copy kept as evidence.")
          PY
          PYTHONPATH=. python3 - <<'PY'
          from pathlib import Path
          from pipeline.params import Params
          from pipeline.wordlist_forge import selected_keys
          params = Params(Path("."))
          for task in ("DNSR-1", "FFUF-0", "FFUF-2"):
              keys = selected_keys(params, task)
              assert keys == ["test_smoke_200"], (task, keys)
          print("REM10 validation: frozen loader parses the runtime wordlists.yaml; selection=[test_smoke_200] active for DNSR-1/FFUF-0/FFUF-2.")
          PY

      - name: "REM12 vehicle threshold accommodation (transient: min_healthy 100->10)"
        run: |
          set -e
          cp tools.yaml ci/b3_tools_runtime_before.yaml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools.yaml")
          lines = p.read_text(encoding="utf-8").splitlines()
          out = []
          hit = False
          for line in lines:
              if line.startswith("  resolver_min_healthy_count:"):
                  out.append("  resolver_min_healthy_count: 10  # REM12 TRANSIENT vehicle accommodation (never committed): seed-pinned REM5 fleet yields 14 healthy; the fixture-era TEST-2 vehicle ran with the same pin (REM7=10). Production value 100 restored at TEST 4 stays committed.")
                  hit = True
              else:
                  out.append(line)
          assert hit, "resolver_min_healthy_count line not found"
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          print("REM12: transient resolver_min_healthy_count 100 -> 10 (single-line text edit, project-YAML dialect preserved). Same accommodation as the TEST-2-era REM7 pin; disclosed in PHASE-REPORT.")
          PY
          PYTHONPATH=. python3 - <<'PY'
          from pathlib import Path
          from pipeline.params import Params
          params = Params(Path("."))
          v = int(params.require("resolver_min_healthy_count"))
          assert v == 10, v
          print("REM12 validation: frozen loader parses tools.yaml; threshold=10 active for this vehicle run only.")
          PY

      - name: Run B3 vehicle (fixture-target.test)
        id: run
        run: |
          set +e
          ./recon.sh run fixture-target.test 2>&1 | tee ci/b3_run_console.log
          echo "run exit=${PIPESTATUS[0]}" | tee ci/b3_run_exit.txt

      - name: Assertions (B3 first sub-step table D1..D9)
        id: assertions
        run: |
          PYTHONPATH=. python3 ci/b3_assertions.py 2>&1 | tee ci/b3_assertions_console.log
          exit "${PIPESTATUS[0]}"

      - name: Teardown (always)
        if: always()
        run: |
          sudo -n python3 docker/vhost-fixture/hosts.py remove || true
          docker compose -f docker-compose.yml -f docker-compose.vhost-fixture.yml --profile vhost-fixture down -v || true

      - name: Upload evidence artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-evidence
          path: |
            ci/b3_verdict.txt
            ci/b3_run_exit.txt
            ci/b3_run_console.log
            ci/b3_assertions_console.log
            ci/b3_resolvers_runtime_before.yaml
            ci/b3_wordlists_runtime_before.yaml
            ci/b3_tools_runtime_before.yaml
            wordlists/forge/counts.log
            wordlists/forge/custom-subdomains.txt
            resolvers/forge/custom-resolvers.txt
            resolvers/forge/quarantine.txt
            recon/fixture-target.test/logs/run.log
            recon/fixture-target.test/state.json
            recon/fixture-target.test/runs.json
            recon/fixture-target.test/diff.json
            recon/fixture-target.test/00_assets/summary.md
            recon/fixture-target.test/00_assets/assets.json
            recon/fixture-target.test/10_subdomains/ffuf/summary.md
            recon/fixture-target.test/10_subdomains/ffuf/data.json
            recon/fixture-target.test/15_vhosts/ffuf-3/**
            recon/fixture-target.test/15_vhosts/ffuf/summary.md
            recon/fixture-target.test/20_dns/dnsx/summary.md
            recon/fixture-target.test/20_dns/dnsx/data.json
            recon/fixture-target.test/30_ports/**
          if-no-files-found: warn

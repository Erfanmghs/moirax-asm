# B4 PORT-SWEEP (spec section 8 order-4 post-MERGE) -- acceptance vehicle.
#
# Vehicle: example.com (committed scope). The FULL pipeline runs (passive
# chain produces the assets; MERGE unions them) and the new post-MERGE stage
# consumes assets.json exactly as frozen: RULE 1 resolution guarantee (ONE
# batched dnsx pass for no-IP hosts), RULE 2 one-scan-per-unique-IP with
# host attribution, RULE 3 explicit target set before any scan, duration-
# budgeted pacing, RAMP+CANARY pacer, filtering intelligence, nmap toggle
# OFF (zero nmap containers -- designated VA hook).
#
# The ACTIVE branch is disabled by a TRANSIENT bounding override (before-copy
# kept as evidence): the passive chain (PSV-0..PSV-8, B3-closed machinery)
# is the asset producer, and port-sweep's RULE 1 guarantee is the IP plane --
# which is exactly the path the spec mandates for post-MERGE hosts without
# resolved IPs.
#
# Transient runtime accommodations (NEVER committed; before-copies kept):
#   - REM5 resolver-fleet refresh from the committed seed (public source URLs
#     disabled at runtime) -- the guarantee pass resolves against a healthy
#     forged fleet (same registry law as DNSR)
#   - active_branch_modules: [] (passive-producer bounding)
#   - passive_branch_budget_sec 1200 -> 3000 (amass 20-min cap + recursion)
#   - passive_recursion_depth 2 -> 1 (example.com passive surface ~2700 hosts)
#   - portsweep_profile full -> custom, portsweep_custom_ports "80,443,8080"
#   - portsweep_duration_hours 24 -> 1 (window budget bounded for CI)
# Committed defaults stay intact (assertion H8 checks git HEAD diff empty).
#
# Steps: checkout -> toolchain -> preflight G-W1..G-W8 -> unit suite ->
# image pulls (soft) -> reconcile stale state -> REM5 fleet refresh ->
# vehicle bounding overrides -> run example.com -> assertions H1..H8/G1..G2
# -> teardown -> evidence upload.

name: b4-portsweep

on:
  workflow_dispatch:

concurrency:
  group: b4-portsweep
  cancel-in-progress: false

jobs:
  b4-portsweep:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: "Checkout (branch: private)"
        uses: actions/checkout@v4
        with:
          ref: private

      - name: Toolchain sanity (docker + python3)
        run: |
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          python3 --version

      - name: "Clone SecLists (registry materialization root: ~/seclists)"
        run: |
          git clone --depth 1 https://github.com/danielmiessler/SecLists "$HOME/seclists"
          find "$HOME/seclists" -name '*.txt' | wc -l
      - name: Preflight gates (G-W1..G-W8)
        run: PYTHONPATH=. python3 ci/b4_preflight.py

      - name: "Install suite deps (REM22/REM23 parity: fastapi + uvicorn + httpx + reportlab)"
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Unit proof (full regression suite incl. B4 port-sweep)
        run: PYTHONPATH=. python3 -m unittest discover -s tests -t . -v

      - name: "Pull tool images (soft -- naabu/dnsx/httpx + passive fleet)"
        run: |
          set +e
          : > ci/b4_pull_report.txt
          for img in \
            projectdiscovery/naabu:v2.3.5 \
            projectdiscovery/dnsx:v1.2.2 \
            projectdiscovery/httpx:v1.10.0 \
            projectdiscovery/subfinder:v2.6.7 \
            caffix/amass:latest \
            edu4rdshl/findomain:latest \
            projectdiscovery/chaos-client:latest \
            curlimages/curl:8.10.1; do
            if docker pull "$img"; then
              echo "pull-ok $img" >> ci/b4_pull_report.txt
            else
              echo "pull-FAILED $img" >> ci/b4_pull_report.txt
            fi
          done
          cat ci/b4_pull_report.txt

      - name: "Build pinned local passive-tools image (gau; REM6 pattern)"
        run: |
          set -e
          docker build -t moirax-asm/passive-tools:v1 -f docker/passive-tools/Dockerfile docker/passive-tools
          docker image inspect moirax-asm/passive-tools:v1 --format 'passive-tools-ok {{.Id}}'

      - name: Reconcile stale live state (frozen stop path; expect EXIT 4 or usage)
        run: |
          set +e
          ./recon.sh stop example.com
          echo "stop exit=$?"

      - name: "REM5 fleet refresh (transient: public source URLs disabled; forge from committed seed)"
        run: |
          set -e
          cp resolvers.yaml ci/b4_resolvers_runtime_before.yaml
          python3 - <<'PY'
          import pathlib
          import yaml
          p = pathlib.Path("resolvers.yaml")
          d = yaml.safe_load(p.read_text(encoding="utf-8"))
          n = len(d.get("sources") or [])
          d["sources"] = []
          p.write_text(yaml.safe_dump(d, sort_keys=False), encoding="utf-8")
          print(f"ENV-ACCOMMODATION REM5: disabled {n} public source URLs at run time; fleet = resolvers/seed.txt (15 pinned anycast). Transient working-copy edit only - never committed.")
          PY
          PYTHONPATH=. python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from pipeline.params import Params
          from pipeline.adapter import Adapter
          from pipeline.breaker import CircuitBreaker
          from pipeline.ceiling import ResourceCeiling
          from pipeline.resolver_forge import forge_resolvers
          params = Params(Path("."))
          tdir = Path(tempfile.mkdtemp()) / "forge-warmup"
          tdir.mkdir(parents=True)
          breaker = CircuitBreaker(params, target_dir=tdir, target="example.com")
          ceiling = ResourceCeiling(params)
          adapter = Adapter(params, tdir, breaker, ceiling)
          forge_resolvers(params, adapter, tdir, "example.com")
          fleet = [ln for ln in (Path("resolvers/forge/custom-resolvers.txt")).read_text().splitlines() if ln.strip()]
          assert len(fleet) >= 10, f"fleet too small: {len(fleet)}"
          print(f"REM5 fleet refresh: healthy={len(fleet)} resolvers from committed seed")
          PY

      - name: "Vehicle bounding overrides (transient: passive-producer + bounded sweep)"
        run: |
          set -e
          cp tools.yaml ci/b4_tools_runtime_before.yaml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools.yaml")
          lines = p.read_text(encoding="utf-8").splitlines()
          out: list[str] = []
          skipping = False
          for line in lines:
              key = line.split(":")[0].strip() if line.startswith("  ") and line.strip().endswith(":") else None
              if key is not None:
                  skipping = key == "active_branch_modules"
                  if skipping:
                      out.append("  active_branch_modules: []  # TRANSIENT vehicle bounding (never committed): passive chain produces assets; the post-MERGE sweep is under test. Committed order restored on checkout.")
                      continue
              if skipping:
                  continue  # drop entries/comments of the bounded block
              if line.startswith("  passive_branch_budget_sec:"):
                  out.append("  passive_branch_budget_sec: 3000  # TRANSIENT vehicle accommodation (never committed): amass 20-min cap + recursion must fit the branch budget.")
                  continue
              if line.startswith("  passive_recursion_depth:"):
                  out.append("  passive_recursion_depth: 1  # TRANSIENT vehicle accommodation (never committed): example.com's passive surface yields 2695+ first-sweep hosts; depth 1 keeps the recursion bounded. Committed default 2 stays (H8 checks git HEAD).")
                  continue
              if line.startswith("  portsweep_profile:"):
                  out.append("  portsweep_profile: custom  # TRANSIENT vehicle accommodation (never committed): bounded custom profile exercises the SAME profile engine + pacing machinery as full; committed default full stays (H8).")
                  continue
              if line.startswith("  portsweep_custom_ports:"):
                  out.append('  portsweep_custom_ports: "80,443,8080"  # TRANSIENT vehicle accommodation (never committed): 3-port custom range keeps the CI sweep bounded; committed default "" stays.')
                  continue
              if line.startswith("  portsweep_duration_hours:"):
                  out.append("  portsweep_duration_hours: 1  # TRANSIENT vehicle accommodation (never committed): minimum window (spec floor) for the CI budget; committed default stays.")
                  continue
              if line.startswith("  portsweep_nmap_sv:"):
                  out.append("  portsweep_nmap_sv: false  # TRANSIENT vehicle accommodation (never committed): keep B4 nmap-sv off so the CI sweep stays bounded; committed default true stays.")
                  continue
              out.append(line)
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          print("VEHICLE OVERRIDE: active branch bounded out; sweep bounded to custom 80,443,8080 over a 1h window (transient; before-copy ci/b4_tools_runtime_before.yaml).")
          PY
          PYTHONPATH=. python3 - <<'PY'
          from pathlib import Path
          from pipeline.params import Params
          params = Params(Path("."))
          assert params.require("active_branch_modules") == [], params.require("active_branch_modules")
          assert int(params.require("passive_branch_budget_sec")) == 3000
          assert int(params.require("passive_recursion_depth")) == 1
          assert params.require("passive_branch_modules") == ["passive-recon"]
          assert params.require("portsweep_profile") == "custom"
          assert params.require("portsweep_custom_ports") == "80,443,8080"
          assert int(params.require("portsweep_duration_hours")) == 1
          assert bool(params.require("portsweep_nmap_sv")) is False
          assert params.require("portsweep_module") == "port-sweep"
          print("Vehicle validation: frozen loader parses tools.yaml; active branch bounded out; sweep armed custom/3-ports/1h; nmap toggle OFF.")
          PY

      - name: Run vehicle (example.com -- passive chain + MERGE + PORT-SWEEP)
        run: |
          set +e
          ./recon.sh run example.com 2>&1 | tee ci/b4_run_console.log
          echo "run exit=${PIPESTATUS[0]}" | tee ci/b4_run_exit.txt

      - name: Assertions (B4 port-sweep table H1..H8 + G1..G2)
        run: |
          PYTHONPATH=. python3 ci/b4_assertions.py 2>&1 | tee ci/b4_assertions_console.log
          exit "${PIPESTATUS[0]}"

      - name: Teardown (always)
        if: always()
        run: |
          docker ps -q --filter "label=recon.pipeline" | xargs -r docker rm -f || true

      - name: Upload evidence artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-portsweep-evidence
          path: |
            ci/b4_verdict.txt
            ci/b4_run_exit.txt
            ci/b4_run_console.log
            ci/b4_assertions_console.log
            ci/b4_pull_report.txt
            ci/b4_resolvers_runtime_before.yaml
            ci/b4_tools_runtime_before.yaml
            resolvers/forge/custom-resolvers.txt
            resolvers/forge/quarantine.txt
            dorks/forge/search-dorks.txt
            recon/example.com/logs/run.log
            recon/example.com/logs/out_of_scope.log
            recon/example.com/state.json
            recon/example.com/runs.json
            recon/example.com/diff.json
            recon/example.com/00_assets/assets.json
            recon/example.com/00_assets/summary.md
            recon/example.com/30_ports/**
            recon/example.com/10_subdomains/passive/**
          if-no-files-found: warn

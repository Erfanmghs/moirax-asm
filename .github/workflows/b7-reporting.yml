# B7 REPORTING (spec section 10) -- acceptance vehicle.
#
# Vehicle: example.com (committed scope), the proven bounding set. The NEW
# run-end reporting stage renders report.md / report.html (section 9.4 theme) /
# export.csv / export.json / report.pdf + report_manifest.json FROM the
# canonical data.json files only (section 10.2), embedding the run timestamp +
# scope.yaml digest. The K-table then proves the companion acceptance
# (counts equal across formats; tampered data.json fails the digest check)
# on the REAL vehicle output, plus dashboard on-demand regeneration.
#
# Transient runtime accommodations (NEVER committed; before-copies kept) --
# the exact proven B4/B5/B6 set.
#
# Steps: checkout -> toolchain -> pip deps (fastapi/uvicorn/httpx/reportlab)
# -> preflight G-R1..G-R7 -> unit suite -> image pulls (soft) ->
# passive-tools build -> reconcile -> REM5 fleet refresh -> bounding
# overrides -> run example.com -> assertions K1..K8/G1 -> teardown -> evidence.

name: b7-reporting

on:
  workflow_dispatch:

concurrency:
  group: b7-reporting
  cancel-in-progress: false

jobs:
  b7-reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: "Checkout (branch: private)"
        uses: actions/checkout@v4
        with:
          ref: private

      - name: Toolchain sanity (docker + python3)
        run: |
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          python3 --version

      - name: "Clone SecLists (registry materialization root: ~/seclists)"
        run: |
          git clone --depth 1 https://github.com/danielmiessler/SecLists "$HOME/seclists"
          find "$HOME/seclists" -name '*.txt' | wc -l
      - name: "Install deps (dashboard TestClient + reportlab for PDF)"
        run: python3 -m pip install --quiet "fastapi==0.115.6" "uvicorn==0.34.0" "httpx==0.28.1" "reportlab==4.2.5"

      - name: Preflight gates (G-R1..G-R7)
        run: PYTHONPATH=. python3 ci/b7_preflight.py

      - name: "Install suite deps (REM22/REM23 parity: fastapi + uvicorn + httpx + reportlab)"
        run: python3 -m pip install --quiet "fastapi==0.115.6" "uvicorn==0.34.0" "httpx==0.28.1" "reportlab==4.2.5"
      - name: Unit proof (full regression suite incl. B7 reporting)
        run: PYTHONPATH=. python3 -m unittest discover -s tests -t . -v

      - name: "Pull tool images (soft -- passive fleet + sweep)"
        run: |
          set +e
          : > ci/b7_pull_report.txt
          for img in \
            projectdiscovery/naabu:v2.3.5 \
            projectdiscovery/dnsx:v1.2.2 \
            projectdiscovery/httpx:v1.10.0 \
            projectdiscovery/subfinder:v2.6.7 \
            caffix/amass:latest \
            edu4rdshl/findomain:latest \
            projectdiscovery/chaos-client:latest \
            curlimages/curl:8.10.1; do
            if docker pull "$img"; then
              echo "pull-ok $img" >> ci/b7_pull_report.txt
            else
              echo "pull-FAILED $img" >> ci/b7_pull_report.txt
            fi
          done
          cat ci/b7_pull_report.txt

      - name: "Build pinned local passive-tools image (REM6 pattern)"
        run: |
          set -e
          docker build -t moirax-asm/passive-tools:v1 -f docker/passive-tools/Dockerfile docker/passive-tools

      - name: Reconcile stale live state (frozen stop path; expect EXIT 4 or usage)
        run: |
          set +e
          ./recon.sh stop example.com
          echo "stop exit=$?"

      - name: "REM5 fleet refresh (transient: public source URLs disabled; forge from committed seed)"
        run: |
          set -e
          cp resolvers.yaml ci/b7_resolvers_runtime_before.yaml
          python3 - <<'PY'
          import pathlib
          import yaml
          p = pathlib.Path("resolvers.yaml")
          d = yaml.safe_load(p.read_text(encoding="utf-8"))
          n = len(d.get("sources") or [])
          d["sources"] = []
          p.write_text(yaml.safe_dump(d, sort_keys=False), encoding="utf-8")
          print(f"ENV-ACCOMMODATION REM5: disabled {n} public source URLs at run time; fleet = resolvers/seed.txt (15 pinned anycast). Transient working-copy edit only - never committed.")
          PY
          PYTHONPATH=. python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from pipeline.params import Params
          from pipeline.adapter import Adapter
          from pipeline.breaker import CircuitBreaker
          from pipeline.ceiling import ResourceCeiling
          from pipeline.resolver_forge import forge_resolvers
          params = Params(Path("."))
          tdir = Path(tempfile.mkdtemp()) / "forge-warmup"
          tdir.mkdir(parents=True)
          breaker = CircuitBreaker(params, target_dir=tdir, target="example.com")
          ceiling = ResourceCeiling(params)
          adapter = Adapter(params, tdir, breaker, ceiling)
          forge_resolvers(params, adapter, tdir, "example.com")
          fleet = [ln for ln in (Path("resolvers/forge/custom-resolvers.txt")).read_text().splitlines() if ln.strip()]
          assert len(fleet) >= 10, f"fleet too small: {len(fleet)}"
          print(f"REM5 fleet refresh: healthy={len(fleet)} resolvers from committed seed")
          PY

      - name: "Vehicle bounding overrides (transient: the proven B4/B5/B6 set)"
        run: |
          set -e
          cp tools.yaml ci/b7_tools_runtime_before.yaml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools.yaml")
          lines = p.read_text(encoding="utf-8").splitlines()
          out: list[str] = []
          skipping = False
          for line in lines:
              key = line.split(":")[0].strip() if line.startswith("  ") and line.strip().endswith(":") else None
              if key is not None:
                  skipping = key == "active_branch_modules"
                  if skipping:
                      out.append("  active_branch_modules: []  # TRANSIENT vehicle bounding (never committed). Committed order restored on checkout.")
                      continue
              if skipping:
                  continue
              if line.startswith("  passive_branch_budget_sec:"):
                  out.append("  passive_branch_budget_sec: 3000  # TRANSIENT vehicle accommodation (never committed).")
                  continue
              if line.startswith("  passive_recursion_depth:"):
                  out.append("  passive_recursion_depth: 1  # TRANSIENT vehicle accommodation (never committed).")
                  continue
              if line.startswith("  portsweep_profile:"):
                  out.append("  portsweep_profile: custom  # TRANSIENT vehicle accommodation (never committed).")
                  continue
              if line.startswith("  portsweep_custom_ports:"):
                  out.append('  portsweep_custom_ports: "80,443,8080"  # TRANSIENT vehicle accommodation (never committed).')
                  continue
              if line.startswith("  portsweep_duration_hours:"):
                  out.append("  portsweep_duration_hours: 1  # TRANSIENT vehicle accommodation (never committed).")
                  continue
              out.append(line)
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          print("VEHICLE OVERRIDE: proven bounding set applied (transient; before-copy ci/b7_tools_runtime_before.yaml).")
          PY
          PYTHONPATH=. python3 - <<'PY'
          from pathlib import Path
          from pipeline.params import Params
          params = Params(Path("."))
          assert params.require("active_branch_modules") == []
          assert int(params.require("passive_branch_budget_sec")) == 3000
          assert int(params.require("passive_recursion_depth")) == 1
          assert params.require("portsweep_profile") == "custom"
          assert int(params.require("portsweep_duration_hours")) == 1
          print("Vehicle validation: frozen loader parses tools.yaml; bounding set intact.")
          PY

      - name: Run vehicle (example.com -- full pipeline + run-end reporting)
        run: |
          set +e
          ./recon.sh run example.com 2>&1 | tee ci/b7_run_console.log
          echo "run exit=${PIPESTATUS[0]}" | tee ci/b7_run_exit.txt

      - name: Assertions (B7 reporting table K1..K8 + G1)
        run: |
          PYTHONPATH=. python3 ci/b7_assertions.py 2>&1 | tee ci/b7_assertions_console.log
          exit "${PIPESTATUS[0]}"

      - name: Teardown (always)
        if: always()
        run: |
          docker ps -q --filter "label=recon.pipeline" | xargs -r docker rm -f || true

      - name: Upload evidence artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b7-reporting-evidence
          path: |
            ci/b7_verdict.txt
            ci/b7_run_exit.txt
            ci/b7_run_console.log
            ci/b7_assertions_console.log
            ci/b7_pull_report.txt
            ci/b7_resolvers_runtime_before.yaml
            ci/b7_tools_runtime_before.yaml
            recon/example.com/90_report/**
            recon/example.com/logs/run.log
            recon/example.com/state.json
            recon/example.com/runs.json
            recon/example.com/diff.json
            recon/example.com/00_assets/assets.json
          if-no-files-found: warn

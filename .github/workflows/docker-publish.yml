# Publishes the ready-made dashboard image so installs can start without
# building (compose service pins the local name moirax-asm-dashboard).
name: docker-publish

on:
  push:
    branches: [private]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit pinned dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit
          pip-audit -r requirements.txt

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/erfanmghs/moirax-asm:dashboard
            ghcr.io/erfanmghs/moirax-asm:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

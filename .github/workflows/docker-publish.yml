# Publishes the ready-made dashboard image so installs can start without
# building (compose service pins the local name recon-pipeline-dashboard;
# users tag the pulled image with that name -- README section 4.5 option A).
name: docker-publish

on:
  push:
    branches: [private]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/erfanmghs/recon-pipeline:dashboard
            ghcr.io/erfanmghs/recon-pipeline:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

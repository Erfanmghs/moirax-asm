# TEST FIXTURE (B2 acceptance smoke)
# Activation (profile + override; default `docker compose config` is unchanged):
#   docker compose -f docker-compose.yml -f docker-compose.vhost-fixture.yml --profile vhost-fixture up -d --build
#   sudo -n python3 docker/vhost-fixture/hosts.py install
# Deactivation:
#   docker compose -f docker-compose.yml -f docker-compose.vhost-fixture.yml --profile vhost-fixture down
#   sudo -n python3 docker/vhost-fixture/hosts.py remove
#
# Adapter ffuf/httpx use --network host (pipeline/** frozen). extra_hosts on the
# compose tool *services* apply to compose-run containers; host-network docker run
# needs the hosts.py mapping to the fixture IP (same names/IP as extra_hosts).

name: recon-pipeline

networks:
  fixture_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.100.0/24

services:
  vhost-fixture:
    profiles: [vhost-fixture]
    build:
      context: ./docker/vhost-fixture
      dockerfile: Dockerfile
    image: recon-pipeline/vhost-fixture:b2-smoke
    hostname: vhost-fixture
    networks:
      fixture_net:
        ipv4_address: 172.28.100.10
    restart: "no"

  ffuf:
    profiles: [vhost-fixture]
    image: busybox:1.36.1
    command: ["sleep", "infinity"]
    extra_hosts:
      - "fixture-target.test:172.28.100.10"
      - "app.fixture-target.test:172.28.100.10"
      - "www.fixture-target.test:172.28.100.10"
    networks:
      fixture_net: {}
    depends_on:
      - vhost-fixture

  httpx:
    profiles: [vhost-fixture]
    image: busybox:1.36.1
    command: ["sleep", "infinity"]
    extra_hosts:
      - "fixture-target.test:172.28.100.10"
      - "app.fixture-target.test:172.28.100.10"
      - "www.fixture-target.test:172.28.100.10"
    networks:
      fixture_net: {}
    depends_on:
      - vhost-fixture

  dnsx:
    profiles: [vhost-fixture]
    image: busybox:1.36.1
    command: ["sleep", "infinity"]
    extra_hosts:
      - "fixture-target.test:172.28.100.10"
      - "app.fixture-target.test:172.28.100.10"
      - "www.fixture-target.test:172.28.100.10"
    networks:
      fixture_net: {}
    depends_on:
      - vhost-fixture

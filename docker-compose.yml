name: recon-pipeline

services:
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: recon-pipeline-dashboard
    command: ["uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8080"]
    working_dir: /app
    # Run as the host operator so forge files are not 0600-root (git/tests/UI).
    # DOCKER_GID must match the host docker socket group for nested docker run.
    user: "${RECON_HOST_UID:-1000}:${RECON_HOST_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "${DASHBOARD_BIND_HOST:-127.0.0.1}:${DASHBOARD_BIND_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - ${SECLISTS_HOST_PATH:-${HOME}/seclists}:${SECLISTS_CONTAINER_PATH:-/usr/share/seclists}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      PYTHONPATH: /app
      # Nested `docker run -v` from inside this container must bind HOST paths.
      RECON_HOST_ROOT: ${RECON_HOST_ROOT:-${PWD}}
    restart: unless-stopped
    profiles:
      - dashboard

name: moirax-asm

services:
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: moirax-asm-dashboard
    command: ["uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8080"]
    working_dir: /app
    # Starts as root so entrypoint can attach the docker.sock GID, then drops
    # to RECON_HOST_UID/GID. Clone-and-run does not need a manual DOCKER_GID.
    ports:
      - "${DASHBOARD_BIND_HOST:-127.0.0.1}:${DASHBOARD_BIND_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - ${SECLISTS_HOST_PATH:-${HOME}/seclists}:${SECLISTS_CONTAINER_PATH:-/usr/share/seclists}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      PYTHONPATH: /app
      HOME: /app
      RECON_HOST_UID: ${RECON_HOST_UID:-1000}
      RECON_HOST_GID: ${RECON_HOST_GID:-1000}
      # Nested `docker run -v` from inside this container must bind HOST paths.
      RECON_HOST_ROOT: ${RECON_HOST_ROOT:-${PWD}}
    restart: unless-stopped
    profiles:
      - dashboard

name: recon-pipeline

services:
  dashboard:
    image: ${DASHBOARD_IMAGE:-busybox:1.36.1}
    command: ["sleep", "infinity"]
    ports:
      - "${DASHBOARD_BIND_HOST:-127.0.0.1}:${DASHBOARD_BIND_PORT:-8080}:8080"
    volumes:
      - ${RECON_VOLUME:-./recon}:/recon
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
    restart: unless-stopped
    profiles:
      - dashboard
